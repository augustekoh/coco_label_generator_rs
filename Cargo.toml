[package]
name = "coco_label_generator_rs"
version = "0.4.4"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["cargo", "string"] }
csv = "1.4.0"
getset = "0.1.6"
git-version = "0.3.9"
indicatif = { version = "0.18.3", features = ["rayon"] }
ndarray = "0.16.1"
ndarray-npy = { version = "0.9.1", features = ["compressed_npz", "npz"] }
num-traits = "0.2.19"
ordered-float = "5.1.0"
rand = "0.9.2"
rand_pcg = "0.9.0"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
